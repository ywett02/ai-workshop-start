# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
  # Started by the screenshot update workflow: its commits do not trigger push events.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture

  # The demos as tests. Screenshots are compared with baselines rendered in this same image;
  # change them by adding the update-screenshots label to the pull request.
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
      # Videos of every run, and on failure the expected, actual and diff screenshots.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/

  # GitHub-hosted workflow evidence, rather than forgeable Git author names.
  baselines:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Screenshots changed only by the Update screenshots workflow
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-baselines.ts

  # Shows what e2e found in one pull request comment, with each changed screenshot's expected,
  # actual and diff images. Images go to the e2e-diffs branch, since comments cannot attach files.
  e2e-report-targets:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.targets.outputs.prs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e-report-targets.ts

  e2e-report:
    needs: [e2e, e2e-report-targets]
    if: ${{ !cancelled() && needs.e2e-report-targets.result == 'success' && needs.e2e-report-targets.outputs.prs != '[]' }}
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.e2e-report-targets.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ matrix.pr }}
      IMAGES: pr-${{ matrix.pr }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-results
          path: e2e-results/
      - name: Write the report
        run: |
          node scripts/e2e-report.ts e2e-results/test-results/results.json report \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/e2e-diffs/$IMAGES" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat report/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the images
        if: ${{ hashFiles('report/images/*.png') != '' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          diffs="$RUNNER_TEMP/e2e-diffs"
          if git fetch --depth 1 origin e2e-diffs; then
            git worktree add --detach "$diffs" FETCH_HEAD
          else
            git worktree add --detach "$diffs" && git -C "$diffs" checkout --orphan e2e-diffs && git -C "$diffs" rm -rfq .
          fi
          mkdir -p "$diffs/$IMAGES" && cp report/images/*.png "$diffs/$IMAGES/"
          git -C "$diffs" add --all && git -C "$diffs" commit -qm "e2e screenshots for #$PR"
          # Other pull requests may publish at the same time; their files never overlap.
          published=false
          for attempt in 1 2 3; do
            if git -C "$diffs" push -q origin HEAD:e2e-diffs; then
              published=true
              break
            fi
            git -C "$diffs" fetch -q --depth 1 origin e2e-diffs && git -C "$diffs" rebase -q FETCH_HEAD
          done
          if [ "$published" != true ]; then
            echo "::error::Could not publish screenshot images after three attempts."
            exit 1
          fi
      - name: Comment on the pull request
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- e2e-screenshots -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report/comment.md > /dev/null
          elif [ -f report/failed ]; then
            gh pr comment "$PR" --body-file report/comment.md
          fi
