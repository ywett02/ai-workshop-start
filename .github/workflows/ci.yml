# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
  # Started by the screenshot update workflow: its commits do not trigger push events.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture

  # The demos as tests. Screenshots are compared with baselines rendered in this same image;
  # change them by adding the update-screenshots label to the pull request.
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
      # Videos of every run, and on failure the expected, actual and diff screenshots.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/

  # Baselines are accepted only after their diff fails on CI and is reviewed: every screenshot a
  # pull request changes must last have been committed by the Update screenshots workflow.
  baselines:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Screenshots changed only by the Update screenshots workflow
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for file in $(git diff --name-only "$BASE...$HEAD" -- e2e/__screenshots__); do
            author=$(git log -1 --format=%an "$BASE..$HEAD" -- "$file")
            if [ "$author" != 'github-actions[bot]' ]; then
              echo "::error file=$file::$file was last changed by $author. Restore it from the base branch, let CI show the diff, and add the update-screenshots label to accept it."
              status=1
            fi
          done
          exit $status
